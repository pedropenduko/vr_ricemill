<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rice Mill App v2</title>

<style>
body { font-family: Arial; margin:0; background:#f4f4f4; }

.tabs { display:flex; background:#2c3e50; }
.tabs button {
    flex:1; padding:12px; color:white; border:none; background:none;
}
.tabs button.active { background:#34495e; }

.tab { display:none; padding:15px; }
.tab.active { display:block; }

label { display:block; margin:10px 0 4px; font-weight:600; }
input, button {
    width:100%; padding:12px; margin:6px 0 12px; font-size:16px; box-sizing:border-box; border:1px solid #ccc; border-radius:4px;
}
button { border:none; cursor:pointer; }

.card {
    background:white; padding:15px; margin:10px 0; border-radius:8px; box-sizing:border-box;
}

.primary { background:#27ae60; color:white; border:none; }

.danger { background:#e74c3c; color:white; border:none; }

.small { font-size:14px; }
    .transaction-row { display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:10px; }
    .transaction-details { flex:1 1 220px; min-width:180px; }
    .transaction-actions { display:flex; gap:8px; flex:0 0 auto; }
    .transaction-actions button { width:auto; margin:0; padding:8px 12px; }
canvas { background:white; border-radius:8px; }
</style>
</head>

<body>

<div class="tabs">
    <button onclick="openTab('settings')" class="active">Settings</button>
    <button onclick="openTab('pos')">POS</button>
    <button onclick="openTab('summary')">Summary</button>
</div>

<!-- SETTINGS -->
<div id="settings" class="tab active">
    <div class="card">
        <h3>Settings</h3>

        <label for="priceKg">Milling Price</label>
        <input id="priceKg" placeholder="Milling price per kg" type="number">

        <label for="priceSack">Price per Sack</label>
        <input id="priceSack" placeholder="Price per sack" type="number">

        <label for="laborKg">Labor Rate</label>
        <input id="laborKg" placeholder="Labor rate per kg" type="number">

        <label for="fuelKg">Fuel Cost</label>
        <input id="fuelKg" placeholder="Fuel cost per kg" type="number">

        <label for="maintenanceKg">Maintenance Cost</label>
        <input id="maintenanceKg" placeholder="Maintenance cost per kg" type="number">
        <label for="drierPerSack">Drier Per Sack</label>
        <input id="drierPerSack" placeholder="Drier fee per sack" type="number">

        <button class="primary" onclick="saveSettings()">Save Settings</button>
        <button class="danger" onclick="resetTransactions()">Reset Transactions</button>
    </div>

    <div class="card">
        <h4>Export</h4>
        <button onclick="exportCSV()">Export CSV</button>
    </div>
</div>

<!-- POS -->
<div id="pos" class="tab">
    <div class="card">
        <h3>Transaction</h3>

        <label for="txDate">Date</label>
        <input id="txDate" type="date">

        <label for="txNumber">Transaction Number</label>
        <input id="txNumber" placeholder="Transaction number (optional)" type="text">

        <label for="kg">Output Kg</label>
        <input id="kg" placeholder="Output kg" type="number">

        <label for="sacks">Sacks Used</label>
        <input id="sacks" placeholder="Sacks used" type="number">
        <label for="sacksDried">Sacks Dried</label>
        <input id="sacksDried" placeholder="Sacks dried (optional)" type="number">

        <button class="primary" onclick="compute()">Compute</button>

        <div id="result"></div>

        <button class="primary" onclick="saveTx()">Save</button>
    </div>

    <div class="card">
        <h4>Transactions</h4>
        <div id="txList"></div>
    </div>
</div>

<!-- SUMMARY -->
<div id="summary" class="tab">
    <div class="card">
        <h3>Filter</h3>
        <input id="startDate" type="date">
        <input id="endDate" type="date">
        <button onclick="loadSummary()">Apply Filter</button>
    </div>

    <div class="card" id="summaryData"></div>

    <div class="card">
        <h4>Profit Trend</h4>
        <canvas id="chart" height="200"></canvas>
    </div>

    <div class="card">
        <h4>Monthly Labor Salary</h4>
        <input id="laborStart" type="date">
        <input id="laborEnd" type="date">
        <button onclick="computeLabor()">Compute Salary</button>
        <div id="laborResult"></div>
    </div>
</div>

<script>

// RESET TRANSACTIONS
async function resetTransactions(){
    if(!confirm('Are you sure you want to delete ALL transactions? This cannot be undone.')) return;
    try {
        const db = await openDatabase();
        const tx = db.transaction(TRANSACTIONS_STORE, 'readwrite');
        const store = tx.objectStore(TRANSACTIONS_STORE);
        await new Promise((resolve, reject) => {
            const req = store.clear();
            req.onsuccess = resolve;
            req.onerror = reject;
        });
        tx.oncomplete = () => db.close();
        await loadTx();
        alert('All transactions have been deleted.');
    } catch (err) {
        alert('Failed to reset transactions.');
        console.error(err);
    }
}
let settings={}, txs=[], editIndex=null;
const DB_NAME='RiceMillApp';
const DB_VERSION=2;
const SETTINGS_STORE='settings';
const TRANSACTIONS_STORE='transactions';

function openDatabase(){
    return new Promise((resolve,reject)=>{
        if(!window.indexedDB){
            reject(new Error('IndexedDB not supported'));
            return;
        }

        const request=indexedDB.open(DB_NAME, DB_VERSION);

        request.onupgradeneeded = event => {
            const db = event.target.result;
            if(!db.objectStoreNames.contains(SETTINGS_STORE)){
                db.createObjectStore(SETTINGS_STORE, { keyPath: 'id' });
            }
            if(!db.objectStoreNames.contains(TRANSACTIONS_STORE)){
                db.createObjectStore(TRANSACTIONS_STORE, { keyPath: 'id', autoIncrement: true });
            }
        };

        request.onsuccess = event => resolve(event.target.result);
        request.onerror = event => reject(event.target.error);
    });
}

function saveSettingsDB(data){
    return openDatabase().then(db => new Promise((resolve,reject) => {
        const tx = db.transaction(SETTINGS_STORE, 'readwrite');
        const store = tx.objectStore(SETTINGS_STORE);
        const request = store.put({ ...data, id: 'appSettings' });
        request.onsuccess = () => resolve(data);
        request.onerror = () => reject(request.error);
        tx.oncomplete = () => db.close();
        tx.onerror = event => reject(event.target.error);
    }));
}

function loadSettingsDB(){
    return openDatabase().then(db => new Promise((resolve,reject) => {
        const tx = db.transaction(SETTINGS_STORE, 'readonly');
        const store = tx.objectStore(SETTINGS_STORE);
        const request = store.get('appSettings');
        request.onsuccess = event => resolve(event.target.result || {});
        request.onerror = () => reject(request.error);
        tx.oncomplete = () => db.close();
        tx.onerror = event => reject(event.target.error);
    }));
}

function saveTransactionDB(transaction){
    return openDatabase().then(db => new Promise((resolve,reject) => {
        const tx = db.transaction(TRANSACTIONS_STORE, 'readwrite');
        const store = tx.objectStore(TRANSACTIONS_STORE);
        const request = store.add(transaction);
        request.onsuccess = () => resolve(transaction);
        request.onerror = () => reject(request.error);
        tx.oncomplete = () => db.close();
        tx.onerror = event => reject(event.target.error);
    }));
}

function loadTransactionsDB(){
    return openDatabase().then(db => new Promise((resolve,reject) => {
        const tx = db.transaction(TRANSACTIONS_STORE, 'readonly');
        const store = tx.objectStore(TRANSACTIONS_STORE);
        const request = store.getAll();
        request.onsuccess = event => resolve(event.target.result || []);
        request.onerror = () => reject(request.error);
        tx.oncomplete = () => db.close();
        tx.onerror = event => reject(event.target.error);
    }));
}

function updateTransactionDB(id, transaction){
    return openDatabase().then(db => new Promise((resolve,reject) => {
        const tx = db.transaction(TRANSACTIONS_STORE, 'readwrite');
        const store = tx.objectStore(TRANSACTIONS_STORE);
        const request = store.put({ ...transaction, id });
        request.onsuccess = () => resolve(transaction);
        request.onerror = () => reject(request.error);
        tx.oncomplete = () => db.close();
        tx.onerror = event => reject(event.target.error);
    }));
}

function deleteTransactionDB(id){
    return openDatabase().then(db => new Promise((resolve,reject) => {
        const tx = db.transaction(TRANSACTIONS_STORE, 'readwrite');
        const store = tx.objectStore(TRANSACTIONS_STORE);
        const request = store.delete(id);
        request.onsuccess = () => resolve();
        request.onerror = () => reject(request.error);
        tx.oncomplete = () => db.close();
        tx.onerror = event => reject(event.target.error);
    }));
}

// TAB
function openTab(id){
    document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
    document.querySelectorAll('.tabs button').forEach(b=>b.classList.remove('active'));
    document.getElementById(id).classList.add('active');
    event.target.classList.add('active');
    if(id==='summary') loadSummary();
}

// SETTINGS
async function saveSettings(){
    settings={
        priceKg:+priceKg.value,
        priceSack:+priceSack.value,
        laborKg:+laborKg.value,
        fuelKg:+fuelKg.value,
        maintenanceKg:+maintenanceKg.value,
        drierPerSack:+drierPerSack.value
    };

    if(window.indexedDB){
        try{
            await saveSettingsDB(settings);
            alert("Saved to IndexedDB");
        } catch(err){
            console.error(err);
            alert("Failed to save settings to IndexedDB");
        }
    } else {
        localStorage.setItem('settings',JSON.stringify(settings));
        alert("Saved to localStorage (fallback)");
    }
}

async function loadSettings(){
    let s={};

    if(window.indexedDB){
        try{
            s = await loadSettingsDB();
        } catch(err){
            console.error(err);
            s = JSON.parse(localStorage.getItem('settings')||"{}");
        }
    } else {
        s = JSON.parse(localStorage.getItem('settings')||"{}");
    }

    Object.assign(settings,s);
    priceKg.value=settings.priceKg||"";
    priceSack.value=settings.priceSack||"";
    laborKg.value=settings.laborKg||"";
    fuelKg.value=settings.fuelKg||"";
    maintenanceKg.value=settings.maintenanceKg||"";
    drierPerSack.value=settings.drierPerSack||"";
} 

// COMPUTE
function compute(){
    let kg=+document.getElementById('kg').value||0;
    let sacks=+document.getElementById('sacks').value||0;
    let sacksDried=+document.getElementById('sacksDried').value||0;

    let millingCost = kg * settings.priceKg;
    let sacksCost = sacks * settings.priceSack;
    let drierFee = sacksDried * (settings.drierPerSack||0);
    let overallTotalCost = millingCost + sacksCost + drierFee;
    let revenue = overallTotalCost;

    result.innerHTML=`Milling Cost: ₱${millingCost.toFixed(2)}<br>
    Sacks Cost: ₱${sacksCost.toFixed(2)}<br>
    Drier Fee: ₱${drierFee.toFixed(2)}<br>
    Overall Total Cost: ₱${overallTotalCost.toFixed(2)}`;
}

// SAVE
async function saveTx(){
    let kg=+document.getElementById('kg').value||0;
    let sacks=+document.getElementById('sacks').value||0;
    let sacksDried=+document.getElementById('sacksDried').value||0;

    let millingCost = kg * settings.priceKg;
    let sacksCost = sacks * settings.priceSack;
    let drierFee = sacksDried * (settings.drierPerSack||0);
    let overallTotalCost = millingCost + sacksCost;
    let revenue = overallTotalCost + drierFee;
    let cost=kg*settings.laborKg + kg*settings.fuelKg + kg*settings.maintenanceKg;
    let profit=revenue-cost;

    let date=document.getElementById('txDate').value || new Date().toISOString().slice(0,10);
    let transactionNumber=document.getElementById('txNumber').value || "";
    let tx={date,transactionNumber,kg,sacks,sacksDried,revenue,cost,profit};

    try{
        if(editIndex!==null){
            await updateTransactionDB(txs[editIndex].id, tx);
            editIndex=null;
        } else {
            await saveTransactionDB(tx);
        }
        document.getElementById('txDate').value=new Date().toISOString().slice(0,10);
        document.getElementById('txNumber').value='';
        document.getElementById('kg').value='';
        document.getElementById('sacks').value='';
        await loadTx();
    } catch(err){
        console.error(err);
        alert("Failed to save transaction");
    }
}

// LOAD TX
async function loadTx(){
    try{
        txs = await loadTransactionsDB();
    } catch(err){
        console.error(err);
        txs=JSON.parse(localStorage.getItem('txs')||"[]");
    }

    let html="";
    txs.forEach((t,i)=>{
        html+=`
        <div class="card small transaction-row">
            <div class="transaction-details">${t.date}${t.transactionNumber ? ' #' + t.transactionNumber : ''} | ${t.kg}kg | Sacks Dried: ${t.sacksDried || 0} | ₱${t.revenue.toFixed(2)}</div>
            <div class="transaction-actions">
                <button onclick="editTx(${i})">Edit</button>
                <button class="danger" onclick="deleteTx(${i})">Delete</button>
            </div>
        </div>`;
    });
    txList.innerHTML=html;
}

// EDIT
function editTx(i){
    let t=txs[i];
    document.getElementById('txDate').value=t.date || new Date().toISOString().slice(0,10);
    document.getElementById('txNumber').value=t.transactionNumber || '';
    document.getElementById('kg').value=t.kg;
    document.getElementById('sacks').value=t.sacks;
    editIndex=i;
}

// DELETE
async function deleteTx(i){
    if(confirm("Delete?")){
        try{
            await deleteTransactionDB(txs[i].id);
            await loadTx();
        } catch(err){
            console.error(err);
            alert("Failed to delete transaction");
        }
    }
}

// SUMMARY
function loadSummary(){
    let s=startDate.value, e=endDate.value;
    let filtered=txs.filter(t=>{
        if(!s && !e) return true;
        return (!s||t.date>=s)&&(!e||t.date<=e);
    });

    let totalKg=0,totalRev=0,totalCost=0,totalProfit=0;

    filtered.forEach(t=>{
        totalKg+=t.kg;
        totalRev+=t.revenue;
        totalCost+=t.cost;
        totalProfit+=t.profit;
    });

    let laborRate = Number(settings.laborKg) || 0;
    let fuelRate = Number(settings.fuelKg) || 0;
    let maintenanceRate = Number(settings.maintenanceKg) || 0;
    let totalLaborCost = totalKg * laborRate;
    let totalFuelCost = totalKg * fuelRate;
    let totalMaintenanceCost = totalKg * maintenanceRate;

    summaryData.innerHTML=`
    Total KG: ${totalKg}<br>
    Revenue: ₱${totalRev.toFixed(2)}<br>
    Total Cost: ₱${totalCost.toFixed(2)}<br>
    Labor Cost: ₱${totalLaborCost.toFixed(2)}<br>
    Fuel Cost: ₱${totalFuelCost.toFixed(2)}<br>
    Maintenance Cost: ₱${totalMaintenanceCost.toFixed(2)}<br>
    Profit: ₱${totalProfit.toFixed(2)}`;

    drawChart(filtered);
}

// CHART
function drawChart(data){
    let c=chart.getContext('2d');
    c.clearRect(0,0,chart.width,chart.height);

    if(data.length===0) return;

    let max=Math.max(...data.map(d=>d.profit));

    data.forEach((d,i)=>{
        let x=i*(chart.width/data.length);
        let h=(d.profit/max)*chart.height;
        c.fillRect(x,chart.height-h,20,h);
    });
}

// LABOR
function computeLabor(){
    let s=laborStart.value, e=laborEnd.value;

    let totalKg=txs.filter(t=>
        (!s||t.date>=s)&&(!e||t.date<=e)
    ).reduce((sum,t)=>sum+t.kg,0);

    let salary=totalKg*settings.laborKg;

    laborResult.innerHTML=`Total KG: ${totalKg}<br>
    Salary: ₱${salary.toFixed(2)}`;
}

// CSV
function exportCSV(){
    let csv="Date,Transaction Number,KG,Sacks,Sacks Dried,Revenue,Labor Cost,Fuel Cost,Maintenance Cost,Cost,Profit\n";
    let sortedTxs = [...txs].sort((a, b) => {
        // Compare by date first
        if (a.date < b.date) return -1;
        if (a.date > b.date) return 1;
        // If dates are equal, compare transaction number (as string, empty last)
        const aNum = a.transactionNumber || "";
        const bNum = b.transactionNumber || "";
        if (aNum < bNum) return -1;
        if (aNum > bNum) return 1;
        return 0;
    });
    sortedTxs.forEach(t=>{
        const laborCost = (t.kg * (settings.laborKg||0)).toFixed(2);
        const fuelCost = (t.kg * (settings.fuelKg||0)).toFixed(2);
        const maintenanceCost = (t.kg * (settings.maintenanceKg||0)).toFixed(2);
        csv+=`${t.date},${t.transactionNumber||""},${t.kg},${t.sacks},${t.sacksDried||0},${t.revenue},${laborCost},${fuelCost},${maintenanceCost},${t.cost},${t.profit}\n`;
    });
    let blob=new Blob([csv]);
    let a=document.createElement('a');
    a.href=URL.createObjectURL(blob);
    a.download="data.csv";
    a.click();
}

function setDefaultTxDate(){
    const txDate = document.getElementById('txDate');
    if(txDate && !txDate.value){
        txDate.value = new Date().toISOString().slice(0,10);
    }
}

// INIT
async function initApp(){
    await loadSettings();
    await loadTx();
    setDefaultTxDate();
    loadSummary();
}

initApp();
</script>

</body>
</html>
